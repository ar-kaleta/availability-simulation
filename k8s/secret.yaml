apiVersion: v1
kind: Secret
metadata:
  name: availability-simulation-secret
  labels:
    app: availability-simulation
type: Opaque
stringData:
  # Cloud SQL Auth Proxy sidecar exposes the database on 127.0.0.1:5432
  # Instance: availability-simulation:us-central1:postgres-db (PostgreSQL 15, Public IP: 34.70.95.53)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://127.0.0.1:5432/availability"
  SPRING_DATASOURCE_USERNAME: "myuser"
  SPRING_DATASOURCE_PASSWORD: "changeme-user-password"
# IMPORTANT: In production, do not use stringData with plain passwords.
# Instead, create this secret from a file or use Sealed Secrets / External Secrets Operator:
#   kubectl create secret generic availability-simulation-secret \
#     --from-literal=SPRING_DATASOURCE_URL='jdbc:postgresql://127.0.0.1:5432/availability' \
#     --from-literal=SPRING_DATASOURCE_USERNAME='myuser' \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='<your-password>' \
#     -n default
#
# Also create the Cloud SQL Auth Proxy credentials secret:
#   gcloud iam service-accounts keys create /tmp/cloud-sql-proxy-key.json \
#     --iam-account=cloud-sql-proxy-sa@PROJECT_ID.iam.gserviceaccount.com
#   kubectl create secret generic cloud-sql-proxy-credentials \
#     --from-file=credentials.json=/tmp/cloud-sql-proxy-key.json \
#     -n default
