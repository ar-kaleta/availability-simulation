apiVersion: v1
kind: Secret
metadata:
  name: availability-simulation-secret
  labels:
    app: availability-simulation
type: Opaque
stringData:
  # With Cloud SQL Auth Proxy sidecar, connect to localhost:5432
  SPRING_DATASOURCE_URL: "jdbc:postgresql://127.0.0.1:5432/availability"
  SPRING_DATASOURCE_USERNAME: "myuser"
  SPRING_DATASOURCE_PASSWORD: "changeme-user-password"
# IMPORTANT: In production, do not use stringData with plain passwords.
# Instead, create this secret from a file or use Sealed Secrets / External Secrets Operator:
#   kubectl create secret generic availability-simulation-secret \
#     --from-literal=SPRING_DATASOURCE_URL='jdbc:postgresql://...' \
#     --from-literal=SPRING_DATASOURCE_USERNAME='myuser' \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='<your-password>' \
#     -n availability-simulation
