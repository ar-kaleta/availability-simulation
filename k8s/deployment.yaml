apiVersion: apps/v1
kind: Deployment
metadata:
  name: availability-simulation
  labels:
    app: availability-simulation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: availability-simulation
  template:
    metadata:
      labels:
        app: availability-simulation
    spec:
      containers:
        - name: availability-simulation
          image: gcr.io/PROJECT_ID/availability-simulation:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: availability-simulation-config
            - secretRef:
                name: availability-simulation-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
