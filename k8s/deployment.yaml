apiVersion: apps/v1
kind: Deployment
metadata:
  name: availability-simulation
  labels:
    app: availability-simulation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: availability-simulation
  template:
    metadata:
      labels:
        app: availability-simulation
    spec:
      containers:
        - name: availability-simulation
          image: gcr.io/PROJECT_ID/availability-simulation:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: availability-simulation-config
            - secretRef:
                name: availability-simulation-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
          args:
            - "--structured-logs"
            - "--auto-iam-authn"
            - "--credentials-file=/secrets/cloud-sql-proxy/credentials.json"
            - "$(CLOUD_SQL_INSTANCE)"
          env:
            - name: CLOUD_SQL_INSTANCE
              value: "PROJECT_ID:us-central1:postgres-db"
          volumeMounts:
            - name: cloud-sql-proxy-creds
              mountPath: /secrets/cloud-sql-proxy
              readOnly: true
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: cloud-sql-proxy-creds
          secret:
            secretName: cloud-sql-proxy-credentials
