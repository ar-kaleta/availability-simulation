# Production Profile
# This profile is activated on GKE via SPRING_PROFILES_ACTIVE=prod in the Dockerfile

# Database - values injected from Kubernetes ConfigMap/Secret via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Kafka - values injected from Kubernetes ConfigMap via environment variables
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}

# Inventory Simulator - tuned for production
simulator.inventory.interval-ms=${SIMULATOR_INVENTORY_INTERVAL_MS:5000}
simulator.inventory.batch-size=${SIMULATOR_INVENTORY_BATCH_SIZE:5}

# Traffic Generator - disabled in production by default
simulator.traffic.enabled=${SIMULATOR_TRAFFIC_ENABLED:false}
simulator.traffic.interval-ms=${SIMULATOR_TRAFFIC_INTERVAL_MS:1000}
simulator.traffic.request-count=${SIMULATOR_TRAFFIC_REQUEST_COUNT:10}

# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Server
server.port=8080
