spring.application.name=availability-simulation

#JPA Configuration
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Inventory Simulator Configuration
simulator.inventory.interval-ms=5000
simulator.inventory.batch-size=5

# Traffic Generator Configuration
simulator.traffic.interval-ms=1000
simulator.traffic.request-count=10
simulator.traffic.enabled=true